<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/styles.css">
    <title>Номера полная страница</title>
</head>
<body>
    <div class="numbersWrapper">
       <div class="number">
        <img src="./assets/numberBackground.png" alt="" class="backroundImage">
 <div class="numberBody">
    <div class="topRow">
        <div class="row">
            <div class="header">СТАНДАРТ</div>
        </div>
        <div class="row">
            <div class="price">
                ОТ 3500₽ ЗА НОЧЬ
            </div>
        </div>
        <div class="row">
            <a href="https://klen-rosha.ru/" class="rowButton booking">ЗАБРОНИРОВАТЬ</a>
        </div>
       </div>
       <div class="bottomRow">
        <div class="row">
            <div class="infoItem">
                <div class="icon"><img class="iconImg" src="./assets/peoples.svg" alt=""></div>
                <div class="itemContent">
                    <div class="itemTitle">Вместимость</div>
                    <div class="itemText">До 4 мест</div>
                </div>
            </div>
            <div class="infoItem">
                <div class="icon"><img class="iconImg" src="./assets/bed.svg" alt=""></div>
                <div class="itemContent">
                    <div class="itemTitle">Кровать</div>
                    <div class="itemText">TWIN/DBL</div>
                </div>
            </div>
            <div class="infoItem">
                <div class="icon"><img class="iconImg" src="./assets/sqare.svg" alt=""></div>
                <div class="itemContent">
                    <div class="itemTitle">Площадь</div>
                    <div class="itemText">25 кв. м</div>
                </div>
            </div>
        </div>
        <div class="row">
            <a href="https://klen-rosha.ru/" class="rowButton about">Подробнее</a>
        </div>
       </div>
 </div>
       </div>
    </div>
</body>
</html>
